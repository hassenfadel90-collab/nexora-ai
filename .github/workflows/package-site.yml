name: Package site

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package current main site
        run: |
          mkdir -p dist-package
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist-package' ./ dist-package/
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-site
          path: dist-package
          include-hidden-files: true
          if-no-files-found: error
