name: Deploy NEXORA V2 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_BASE_PATH: '/nexora-ai'
      NEXT_PUBLIC_SITE_ORIGIN: 'https://hassenfadel90-collab.github.io'
      NEXT_PUBLIC_SUPABASE_URL: 'https://tkcfrjxyvnguvvbnqpxj.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_946_5GgY_4_JOTarypoMlw_nA_YuVXe'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build NEXORA V2 static export
        run: npm run build

      - name: Release smoke check
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/en/index.html
          test -f out/login/index.html
          test -f out/command/index.html
          test -f out/command/leads/index.html
          test -f out/command/projects/index.html
          test -f out/command/tasks/index.html
          test -f out/command/team/index.html
          test -f out/command/clients/index.html
          test -f out/command/files/index.html
          test -f out/command/messages/index.html
          test -f out/portal/index.html
          test -f out/portal/login/index.html
          test -f out/portal/activate/index.html
          test -f out/portal/messages/index.html
          test -f out/reset-password/index.html
          test -f out/nexora-mark.svg
          test -f out/service-worker.js
          touch out/.nojekyll
          echo 'NEXORA V2 release files verified.'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
