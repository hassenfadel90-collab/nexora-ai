name: Deploy NEXORA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -euo pipefail
          mkdir -p _site/dashboard _site/portal _site/assets _site/security _site/status _site/insights
          cp index.html styles.css titanium-home.css script.js route-guard.js base-styles.css base-script.js premium-home.css premium-home.js apple-ultra.css responsive-fix.css laptop-fix.css layout-final.css ultra-home.css ultra-qa.css manifest.webmanifest service-worker.js robots.txt sitemap.xml _site/
          cp -r assets/. _site/assets/
          cp dashboard/index.html dashboard/dashboard.css dashboard/dashboard-laptop-fix.css dashboard/titanium-dashboard.css dashboard/dashboard.js dashboard/dashboard-base.js dashboard/dashboard-core.js dashboard/suite-88.css dashboard/suite-88.js dashboard/suite-88-ultra.css dashboard/suite-88-ultra.js dashboard/client-invites.js dashboard/auth-ui-fix.js dashboard/auth-session-fix.js dashboard/ui-actions.js _site/dashboard/
          cp portal/index.html portal/portal.css portal/titanium-portal.css portal/portal.js portal/portal-activation.js portal/portal-auth-fix.js _site/portal/
          cp security/index.html _site/security/index.html
          cp status/index.html _site/status/index.html
          cp insights/index.html _site/insights/index.html
          touch _site/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          import re

          BASE = '/nexora-ai'
          OFFICIAL = 'https://hassenfadel90-collab.github.io/nexora-ai/'
          root = Path('_site')

          home = root / 'index.html'
          text = home.read_text(encoding='utf-8')
          if 'laptop-fix.css' not in text:
              text = text.replace('</head>', '  <link rel="stylesheet" href="laptop-fix.css?v=ghp-20260909-6" />\n</head>')
          if 'layout-final.css' not in text:
              text = text.replace('</head>', '  <link rel="stylesheet" href="layout-final.css?v=ghp-20260909-6" />\n</head>')
          text = text.replace('href="styles.css"', 'href="styles.css?v=titanium-20260909-1"')
          text = text.replace('src="script.js"', 'src="script.js?v=titanium-20260909-1"')
          text = text.replace('assets/dashboard-showcase.jpg', 'assets/nexora-platform.svg')
          text = text.replace('https://nexora-ai-iraq.netlify.app/', OFFICIAL)
          text = text.replace('<meta name="theme-color" content="#070a11" />','<meta name="theme-color" content="#f5f5f7" />')
          home.write_text(text, encoding='utf-8')

          dash = root / 'dashboard' / 'index.html'
          text = dash.read_text(encoding='utf-8')
          if 'dashboard-laptop-fix.css' not in text:
              text = text.replace('</head>', '  <link rel="stylesheet" href="dashboard-laptop-fix.css?v=ghp-20260909-6" />\n</head>')
          dash.write_text(text, encoding='utf-8')

          local_roots = [
              'dashboard/', 'portal/', 'security/', 'status/', 'insights/', 'assets/', 'manifest.webmanifest',
              'service-worker.js', 'base-script.js', 'premium-home.js', 'route-guard.js',
              'styles.css', 'titanium-home.css', 'script.js', 'apple-ultra.css', 'responsive-fix.css',
              'laptop-fix.css', 'layout-final.css', 'ultra-home.css', 'ultra-qa.css'
          ]

          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html', '.js', '.css', '.webmanifest'}:
                  continue
              t = p.read_text(encoding='utf-8')
              t = t.replace('href="/#', f'href="{BASE}/#')
              t = t.replace("href='/#", f"href='{BASE}/#")
              t = t.replace('href="/"', f'href="{BASE}/"')
              t = t.replace("href='/'", f"href='{BASE}/'")
              for item in local_roots:
                  t = t.replace(f'"/{item}', f'"{BASE}/{item}')
                  t = t.replace(f"'/{item}", f"'{BASE}/{item}")
              t = t.replace(f'{BASE}{BASE}/', f'{BASE}/')
              p.write_text(t, encoding='utf-8')

          sw = root / 'service-worker.js'
          t = sw.read_text(encoding='utf-8')
          t = t.replace("const CACHE='nexora-shell-v1'", "const CACHE='nexora-shell-ghp-v9'")
          sw.write_text(t, encoding='utf-8')

          required = [
              root / 'index.html', root / 'titanium-home.css', root / 'assets' / 'nexora-mark.svg',
              root / 'dashboard' / 'index.html', root / 'dashboard' / 'titanium-dashboard.css', root / 'dashboard' / 'auth-session-fix.js',
              root / 'portal' / 'index.html', root / 'portal' / 'titanium-portal.css',
              root / 'security' / 'index.html', root / 'status' / 'index.html', root / 'insights' / 'index.html',
              root / 'laptop-fix.css', root / 'layout-final.css', root / 'dashboard' / 'dashboard-laptop-fix.css',
              root / 'dashboard' / 'auth-ui-fix.js', root / 'dashboard' / 'ui-actions.js',
              root / 'portal' / 'portal-auth-fix.js'
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit('Missing release files: ' + ', '.join(missing))

          bad = []
          bad_re = re.compile(r'(["\'])/(dashboard|portal|security|status|insights)/')
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.html', '.js'}:
                  t = p.read_text(encoding='utf-8')
                  if bad_re.search(t): bad.append(str(p))
          if bad:
              raise SystemExit('Unscoped GitHub Pages routes remain in: ' + ', '.join(bad))

          print('GitHub Pages Titanium + route + laptop + showcase QA passed')
          PY

          python3 qa-interactions.py _site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
