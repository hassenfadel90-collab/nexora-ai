name: Deploy NEXORA Titanium to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_BASE_PATH: '/nexora-ai'
      NEXT_PUBLIC_SITE_ORIGIN: 'https://hassenfadel90-collab.github.io'
      NEXT_PUBLIC_SUPABASE_URL: 'https://tkcfrjxyvnguvvbnqpxj.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_946_5GgY_4_JOTarypoMlw_nA_YuVXe'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: GitHub Pages route guard
        run: |
          set -euo pipefail
          bad=$(grep -RInE "window\.location\.(replace|href)[^(=]*[=(][[:space:]]*['\"]/|window\.location\.origin[[:space:]]*\+[[:space:]]*['\"]/|window\.location\.origin\}\/|src=['\"]/nexora-mark\.svg" app components lib --include='*.tsx' --include='*.ts' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo 'Unscoped browser route found. Use withBasePath().'
            exit 1
          fi

      - name: Build production static export
        run: npm run build

      - name: Release smoke check
        run: |
          set -euo pipefail
          for f in \
            out/index.html \
            out/en/index.html \
            out/login/index.html \
            out/reset-password/index.html \
            out/command/index.html \
            out/command/leads/index.html \
            out/command/projects/index.html \
            out/command/tasks/index.html \
            out/command/team/index.html \
            out/command/clients/index.html \
            out/command/files/index.html \
            out/command/messages/index.html \
            out/command/proposals/index.html \
            out/command/invoices/index.html \
            out/command/agents/index.html \
            out/command/automations/index.html \
            out/command/approvals/index.html \
            out/command/analytics/index.html \
            out/command/activity/index.html \
            out/command/settings/index.html \
            out/portal/index.html \
            out/portal/login/index.html \
            out/portal/activate/index.html \
            out/portal/messages/index.html \
            out/insights/index.html \
            out/security/index.html \
            out/status/index.html \
            out/nexora-mark.svg \
            out/service-worker.js; do
              test -f "$f" || { echo "Missing release file: $f"; exit 1; }
          done
          touch out/.nojekyll
          echo 'NEXORA Titanium release files verified.'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
