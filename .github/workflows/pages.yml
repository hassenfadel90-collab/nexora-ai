name: Deploy NEXORA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site/dashboard _site/portal _site/assets
          cp index.html styles.css script.js base-styles.css base-script.js premium-home.css premium-home.js apple-ultra.css responsive-fix.css ultra-home.css ultra-qa.css manifest.webmanifest service-worker.js robots.txt sitemap.xml _site/
          cp -r assets/. _site/assets/
          cp dashboard/index.html dashboard/dashboard.css dashboard/dashboard.js dashboard/dashboard-base.js dashboard/dashboard-core.js dashboard/suite-88.css dashboard/suite-88.js dashboard/suite-88-ultra.css dashboard/suite-88-ultra.js dashboard/client-invites.js _site/dashboard/
          cp portal/index.html portal/portal.css portal/portal.js portal/portal-activation.js _site/portal/
          touch _site/.nojekyll

          # GitHub Pages serves this repository under /nexora-ai/.
          # Rewrite only production-site absolute paths inside the artifact;
          # source files remain host-neutral for Vercel/Netlify/custom domains.
          sed -i 's#href="/portal/#href="/nexora-ai/portal/#g; s#href="/dashboard/#href="/nexora-ai/dashboard/#g; s#href="/"#href="/nexora-ai/"#g; s#src="/assets/#src="/nexora-ai/assets/#g' _site/index.html _site/dashboard/index.html _site/portal/index.html
          sed -i "s#url('/#url('/nexora-ai/#g" _site/styles.css
          sed -i "s#load('/base-script.js#load('/nexora-ai/base-script.js#g; s#load('/premium-home.js#load('/nexora-ai/premium-home.js#g" _site/script.js
          sed -i "s#href=\"/dashboard/#href=\"/nexora-ai/dashboard/#g; s#href=\"/portal/#href=\"/nexora-ai/portal/#g; s#l.href='/manifest.webmanifest#l.href='/nexora-ai/manifest.webmanifest#g; s#register('/service-worker.js#register('/nexora-ai/service-worker.js#g" _site/base-script.js
          sed -i "s#href=\"/portal/#href=\"/nexora-ai/portal/#g; s#href=\"/dashboard/#href=\"/nexora-ai/dashboard/#g" _site/premium-home.js
          sed -i "s#'/dashboard/#'/nexora-ai/dashboard/#g" _site/dashboard/dashboard.js _site/dashboard/suite-88.js _site/dashboard/suite-88-ultra.js
          sed -i "s#location.origin+'/dashboard/#location.origin+'/nexora-ai/dashboard/#g" _site/dashboard/dashboard-base.js
          sed -i "s#href=\"/dashboard/#href=\"/nexora-ai/dashboard/#g; s#href=\"/portal/#href=\"/nexora-ai/portal/#g; s#href=\"/\"#href=\"/nexora-ai/\"#g" _site/dashboard/index.html _site/portal/index.html
          sed -i "s#const SHELL=\['/','/styles.css','/script.js','/dashboard/','/portal/'\]#const SHELL=['/nexora-ai/','/nexora-ai/styles.css','/nexora-ai/script.js','/nexora-ai/dashboard/','/nexora-ai/portal/']#; s#caches.match('/')#caches.match('/nexora-ai/')#g" _site/service-worker.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
