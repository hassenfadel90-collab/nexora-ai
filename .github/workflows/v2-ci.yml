name: NEXORA V2 Build QA

on:
  push:
    branches:
      - nexora-v2-rebuild
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-v2-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
