name: Release 88 QA

on:
  push:
    branches:
      - release-88-ultra
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check base-script.js
          node --check premium-home.js
          node --check dashboard/dashboard-base.js
          node --check dashboard/dashboard-core.js
          node --check dashboard/dashboard.js
          node --check dashboard/suite-88.js
          node --check dashboard/suite-88-ultra.js
          node --check portal/portal.js
          node --check service-worker.js
      - name: Release static QA
        run: node scripts/release-88-qa.mjs
